<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="description" content="lofi 24/7" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://lofi.md/" />
		<meta property="og:title" content="lofi.md" />
		<meta property="og:description" content="lofi 24/7" />
		<meta property="og:image" content="https://lofi.md/lofimd.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1920" />
		<meta property="og:image:height" content="1080" />
		<meta property="og:image:alt" content="lofi.md" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="lofi.md" />
		<meta name="twitter:description" content="lofi 24/7" />
		<meta name="twitter:image" content="https://lofi.md/lofimd.png" />
		<meta name="twitter:image:alt" content="lofi.md" />
		<meta name="theme-color" content="#0b0b0d" />
		<link rel="canonical" href="https://lofi.md/" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>lofi.md</title>
	</head>
	<body>
		<!-- Fullscreen art: the banner illustration fills the viewport. The animated
		     loop is attached and faded in only once the radio is actually playing. -->
		<div id="backdrop" aria-hidden="true">
			<video id="backdrop-video" muted loop playsinline preload="none" poster="/lofimd.webp"></video>
		</div>

		<main id="stage">
			<!-- Two rows of text + a 36x36 cover, 36px from the top and right edges. -->
			<div id="meta" data-loaded="false">
				<div id="text">
					<p id="title"></p>
					<p id="artist"></p>
				</div>
				<img id="cover" alt="" crossorigin="anonymous" width="36" height="36" />
			</div>

			<button id="toggle" type="button" aria-label="Play">
				<svg id="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
					<path d="M8 5v14l11-7z" />
				</svg>
				<svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" hidden>
					<path d="M6 5h4v14H6zM14 5h4v14h-4z" />
				</svg>
			</button>
		</main>

		<footer id="footer">
			<p>
				made with <span aria-hidden="true">♥</span><span class="sr-only">love</span> by luiz cieslak.
				<a href="https://cieslak.dev/en/blog/2026-06-24-lofi/">open source</a>
			</p>
		</footer>

		<audio id="audio" preload="none"></audio>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
